name: Build wheels

# Releasing is done by pushing a tag and nothing else: the version of the
# wheels comes from the tag name, so no file in the repository carries it
# and there is no "bump version" commit to make.
#
#   git tag v0.1.9 && git push origin v0.1.9
#
# Builds that are not tagged produce a 0.0.0.dev0+<sha> wheel and are not
# uploaded anywhere.

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    types: [opened, reopened]

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  # The language bindings are generated from the isl headers by a clang tool.
  # That tool is not built while packaging (the wheel build configures with
  # --with-clang=no), so generate them here, once, and hand them to every
  # wheel build.  The result only depends on the headers, so a single run
  # covers all platforms.
  interface:
    name: Generate the language bindings
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install clang and autotools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          autoconf automake libtool \
          llvm-dev libclang-dev libclang-cpp-dev
        llvm-config --version

    - name: Generate
      run: |
        ./autogen.sh
        ./configure --with-clang=system --with-int=imath
        make interface/isl.py.core interface/Interop.cs

    - name: Report drift from the committed copies
      run: |
        git diff --stat -- interface/isl.py.core interface/Interop.cs
        git diff --quiet -- interface/isl.py.core interface/Interop.cs \
          || echo "::warning::the committed bindings differ from the ones just generated; the wheels use the generated ones"

    - uses: actions/upload-artifact@v4
      with:
        name: interface
        path: |
          interface/isl.py.core
          interface/Interop.cs
        if-no-files-found: error

  build_wheels:
    name: Wheels for ${{ matrix.config.os }} ${{ matrix.config.arch }}
    needs: interface
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          # - { os: macos-13, arch: 'x86_64' }
          - { os: macos-latest, arch: 'arm64' }
          - { os: ubuntu-latest, arch: 'x86_64' }
          # Windows is still open, see the TODO list in README.md.  It needs
          # the whole build to run under msys2/MINGW64.
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Take the bindings generated by the interface job
      uses: actions/download-artifact@v4
      with:
        name: interface
        path: interface

    - name: Set up build environment (Linux)
      run: |
        echo "CC=gcc-14" >> $GITHUB_ENV
        echo "CXX=g++-14" >> $GITHUB_ENV
      if: runner.os == 'Linux'

    - name: Set up build environment (MacOs)
      run: |
        brew install readline
        brew install automake
        brew install autogen
        uname -m
      if: runner.os == 'macOS'

    - name: Install cibuildwheel
      run: pip install cibuildwheel

    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

    # The version reaches setup.py through the environment, so nothing in
    # the repository has to be edited to make a release.
    - name: Resolve version
      shell: bash
      run: |
        if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="0.0.0.dev0+g$(git rev-parse --short HEAD)"
        fi
        echo "ISL_PYTHON_VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "building version $VERSION"

    - name: Build wheels
      env:
        CIBW_ARCHS_MACOS: ${{ matrix.config.arch }}
        # CIBW_ENVIRONMENT also reaches the manylinux container.
        CIBW_ENVIRONMENT: ISL_PYTHON_VERSION=${{ env.ISL_PYTHON_VERSION }}
      run: python -m cibuildwheel --output-dir wheelhouse
      shell: bash

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.config.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl
        if-no-files-found: error

  upload_pypi:
    needs: [build_wheels]
    runs-on: ubuntu-latest
    # upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
